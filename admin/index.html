<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOZ Admin</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 250px;
            background: #1a1a1a;
            color: white;
            padding: 1.5rem;
        }

        .admin-sidebar a {
            display: block;
            color: #9ca3af;
            padding: 0.8rem;
            text-decoration: none;
            border-radius: 8px;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: #2d2d2d;
            color: white;
        }

        .admin-main {
            flex: 1;
            padding: 2rem;
            background: var(--bg-alt);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }

        .admin-google-btn {
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.85rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #222;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .admin-google-btn:hover {
            background: #f7f7f7;
        }

        .admin-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1rem 0;
            color: #888;
            font-size: 0.85rem;
        }

        .admin-divider::before,
        .admin-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }
    </style>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CHOZ Supabase Configuration -->
    <script src="/js/config.js"></script>
</head>

<body>

    <!-- =====================================================
         ADMIN LOGIN
    ====================================================== -->

    <div id="admin-login" class="modal" style="display:flex;">
        <div class="modal-content">

            <h3>Admin Login</h3>

            <form id="admin-form">

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Admin Email"
                    required
                >

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="admin-login-btn"
                >
                    Login
                </button>

            </form>

            <div class="admin-divider">
                OR
            </div>

            <button
                type="button"
                class="admin-google-btn"
                id="admin-google-btn"
            >
                Continue with Google
            </button>

        </div>
    </div>


    <!-- =====================================================
         ADMIN APP
    ====================================================== -->

    <div id="admin-app" class="admin-layout hidden">

        <aside class="admin-sidebar">

            <h3 style="margin-bottom:1.5rem;">
                CHOZ Admin
            </h3>

            <a href="#" class="active" data-section="dashboard">
                Dashboard
            </a>

            <a href="#" data-section="items">
                Products
            </a>

            <a href="#" data-section="categories">
                Categories
            </a>

            <a href="#" data-section="reviews">
                Reviews
            </a>

            <a href="#" data-section="feedback">
                Feedback
            </a>

            <a href="#" data-section="users">
                Users
            </a>

            <a href="#" data-section="settings">
                Settings
            </a>

            <a href="#" onclick="adminSignOut()">
                Sign Out
            </a>

        </aside>


        <main class="admin-main">

            <header class="admin-header">

                <h2 id="admin-title">
                    Dashboard
                </h2>

                <span id="admin-user"></span>

            </header>

            <div id="admin-content"></div>

        </main>

    </div>


    <script>

        let adminUser = null;


        // ====================================================
        // CHECK WHETHER USER IS ADMIN
        // ====================================================

        async function checkAdminSession() {

            try {

                const {
                    data: { session },
                    error
                } = await chozSupabase.auth.getSession();

                if (error) {
                    console.error(
                        'Session error:',
                        error
                    );
                    return false;
                }

                if (!session) {
                    return false;
                }

                const { data: adminData, error: adminError } =
                    await chozSupabase
                        .from('admin_users')
                        .select('*')
                        .eq('user_id', session.user.id)
                        .single();

                if (adminError || !adminData) {

                    await chozSupabase.auth.signOut();

                    alert(
                        'You are not authorized as admin.'
                    );

                    return false;
                }

                adminUser = {
                    ...session.user,
                    role: adminData.role
                };

                document.getElementById(
                    'admin-login'
                ).style.display = 'none';

                document
                    .getElementById('admin-app')
                    .classList.remove('hidden');

                document.getElementById(
                    'admin-user'
                ).textContent =
                    session.user.email || '';

                loadAdminSection('dashboard');

                return true;

            } catch (error) {

                console.error(
                    'Admin session error:',
                    error
                );

                return false;
            }
        }


        // ====================================================
        // EMAIL + PASSWORD ADMIN LOGIN
        // ====================================================

        async function adminLogin(
            email,
            password
        ) {

            const { data, error } =
                await chozSupabase.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });

            if (error) {
                throw error;
            }


            // Check admin_users table

            const {
                data: adminData,
                error: adminError
            } = await chozSupabase
                .from('admin_users')
                .select('*')
                .eq('user_id', data.user.id)
                .single();


            if (adminError || !adminData) {

                await chozSupabase.auth.signOut();

                throw new Error(
                    'You are not authorized as admin.'
                );
            }


            adminUser = {
                ...data.user,
                role: adminData.role
            };


            document.getElementById(
                'admin-login'
            ).style.display = 'none';

            document
                .getElementById('admin-app')
                .classList.remove('hidden');


            document.getElementById(
                'admin-user'
            ).textContent =
                data.user.email || '';


            loadAdminSection('dashboard');
        }


        // ====================================================
        // GOOGLE ADMIN LOGIN
        // ====================================================

        async function adminGoogleLogin() {

            const button =
                document.getElementById(
                    'admin-google-btn'
                );

            if (button) {
                button.disabled = true;
                button.textContent =
                    'Connecting to Google...';
            }

            try {

                const { error } =
                    await chozSupabase.auth
                        .signInWithOAuth({

                            provider: 'google',

                            options: {

                                redirectTo:
                                    window.location.origin +
                                    '/admin/'
                            }
                        });


                if (error) {
                    throw error;
                }

            } catch (error) {

                console.error(
                    'Admin Google login error:',
                    error
                );

                alert(
                    error.message ||
                    'Google login failed.'
                );

                if (button) {
                    button.disabled = false;
                    button.textContent =
                        'Continue with Google';
                }
            }
        }


        // ====================================================
        // SIGN OUT
        // ====================================================

        async function adminSignOut() {

            await chozSupabase.auth.signOut();

            adminUser = null;

            document.getElementById(
                'admin-login'
            ).style.display = 'flex';

            document
                .getElementById('admin-app')
                .classList.add('hidden');
        }


        // ====================================================
        // EMAIL LOGIN FORM
        // ====================================================

        document
            .getElementById('admin-form')
            .addEventListener(
                'submit',
                async (e) => {

                    e.preventDefault();

                    const button =
                        document.getElementById(
                            'admin-login-btn'
                        );

                    button.disabled = true;
                    button.textContent =
                        'Logging in...';

                    try {

                        await adminLogin(
                            document.getElementById(
                                'admin-email'
                            ).value.trim(),

                            document.getElementById(
                                'admin-password'
                            ).value
                        );

                    } catch (err) {

                        console.error(
                            'Admin login error:',
                            err
                        );

                        alert(
                            err.message ||
                            'Admin login failed.'
                        );

                    } finally {

                        button.disabled = false;

                        button.textContent =
                            'Login';
                    }
                }
            );


        // ====================================================
        // GOOGLE LOGIN BUTTON
        // ====================================================

        document
            .getElementById(
                'admin-google-btn'
            )
            .addEventListener(
                'click',
                adminGoogleLogin
            );


        // ====================================================
        // SIDEBAR
        // ====================================================

        document
            .querySelectorAll(
                '.admin-sidebar a[data-section]'
            )
            .forEach(link => {

                link.addEventListener(
                    'click',
                    (e) => {

                        e.preventDefault();

                        document
                            .querySelectorAll(
                                '.admin-sidebar a'
                            )
                            .forEach(a =>
                                a.classList.remove(
                                    'active'
                                )
                            );

                        link.classList.add(
                            'active'
                        );

                        loadAdminSection(
                            link.dataset.section
                        );
                    }
                );
            });


        // ====================================================
        // ADMIN SECTIONS
        // ====================================================

        async function loadAdminSection(section) {

            const content =
                document.getElementById(
                    'admin-content'
                );

            const title =
                document.getElementById(
                    'admin-title'
                );

            content.innerHTML =
                '<p>Loading...</p>';


            if (section === 'dashboard') {

                title.textContent =
                    'Dashboard';


                const { count: users } =
                    await chozSupabase
                        .from('profiles')
                        .select('*', {
                            count: 'exact',
                            head: true
                        });


                const { count: items } =
                    await chozSupabase
                        .from('items')
                        .select('*', {
                            count: 'exact',
                            head: true
                        });


                const { count: reviews } =
                    await chozSupabase
                        .from('user_reviews')
                        .select('*', {
                            count: 'exact',
                            head: true
                        });


                content.innerHTML = `

                    <div
                        class="stats-grid"
                        style="
                            display:grid;
                            grid-template-columns:repeat(3,1fr);
                            gap:1rem;
                        "
                    >

                        <div class="admin-card">
                            <h3>${users || 0}</h3>
                            <p>Total Users</p>
                        </div>

                        <div class="admin-card">
                            <h3>${items || 0}</h3>
                            <p>Products</p>
                        </div>

                        <div class="admin-card">
                            <h3>${reviews || 0}</h3>
                            <p>Reviews</p>
                        </div>

                    </div>
                `;


            } else if (section === 'items') {

                title.textContent =
                    'Products';


                const { data } =
                    await chozSupabase
                        .from('items')
                        .select(
                            '*, categories(name), brands(name)'
                        )
                        .order(
                            'created_at',
                            {
                                ascending: false
                            }
                        )
                        .limit(50);


                content.innerHTML = `

                    <div class="admin-card">

                        <table
                            style="
                                width:100%;
                                border-collapse:collapse;
                            "
                        >

                            <thead>

                                <tr
                                    style="
                                        text-align:left;
                                        border-bottom:1px solid #eee;
                                    "
                                >

                                    <th style="padding:0.5rem;">
                                        Name
                                    </th>

                                    <th style="padding:0.5rem;">
                                        Category
                                    </th>

                                    <th style="padding:0.5rem;">
                                        Brand
                                    </th>

                                    <th style="padding:0.5rem;">
                                        Price
                                    </th>

                                    <th style="padding:0.5rem;">
                                        Demo
                                    </th>

                                </tr>

                            </thead>

                            <tbody>

                                ${(data || []).map(i => `

                                    <tr
                                        style="
                                            border-bottom:1px solid #f5f5f5;
                                        "
                                    >

                                        <td style="padding:0.5rem;">
                                            ${i.name}
                                        </td>

                                        <td style="padding:0.5rem;">
                                            ${i.categories?.name || '—'}
                                        </td>

                                        <td style="padding:0.5rem;">
                                            ${i.brands?.name || '—'}
                                        </td>

                                        <td style="padding:0.5rem;">
                                            ${i.currency}
                                            ${i.base_price?.toLocaleString() || '—'}
                                        </td>

                                        <td style="padding:0.5rem;">
                                            ${i.is_demo ? '✅' : '❌'}
                                        </td>

                                    </tr>

                                `).join('')}

                            </tbody>

                        </table>

                    </div>
                `;


            } else if (section === 'feedback') {

                title.textContent =
                    'Feedback';


                const { data } =
                    await chozSupabase
                        .from('feedback')
                        .select('*')
                        .order(
                            'created_at',
                            {
                                ascending: false
                            }
                        );


                content.innerHTML =
                    (data || [])
                        .map(f => `

                            <div class="admin-card">

                                <h4>
                                    ${f.subject || f.type}
                                </h4>

                                <p>
                                    ${f.message}
                                </p>

                                <small>
                                    ${f.email || 'No email'}
                                    —
                                    ${new Date(
                                        f.created_at
                                    ).toLocaleString()}
                                </small>

                            </div>

                        `)
                        .join('') ||
                    '<p>No feedback yet.</p>';


            } else {

                title.textContent =
                    section.charAt(0).toUpperCase() +
                    section.slice(1);

                content.innerHTML =
                    `<p>${section} section — coming soon.</p>`;
            }
        }


        // ====================================================
        // INITIAL ADMIN SESSION CHECK
        // ====================================================

        checkAdminSession();

    </script>

</body>
</html>
