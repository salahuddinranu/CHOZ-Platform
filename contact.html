<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — CHOZ</title>
<meta name="description" content="Get in touch with the CHOZ team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.contact-wrap{padding:60px 0;max-width:560px;margin:0 auto}
.contact-wrap h1{font-size:clamp(32px,5vw,48px);margin-bottom:12px;letter-spacing:-1px}
.contact-wrap .lead{color:var(--mute);font-size:16px;margin-bottom:32px}
.contact-wrap label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.contact-wrap input,.contact-wrap textarea,.contact-wrap select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:16px;font-family:inherit;background:var(--sf);color:var(--ink)}
.contact-wrap textarea{min-height:140px;resize:vertical}
.msg{padding:14px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none}
.msg.ok{background:#dcfce7;color:#166534;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
</style>
</head>
<body>
<nav><div class="w">
<a class="logo" href="/">CHOZ</a>
<div class="sp"></div>
<a class="btn" href="/">← Back to CHOZ</a>
</div></nav>

<div class="w contact-wrap">
<h1>Contact Us</h1>
<p class="lead">Send us a message. We reply to all messages within 2 business days.</p>

<div id="msg" class="msg"></div>

<form id="contactForm">
<label for="type">Subject</label>
<select id="type" required>
<option value="">Choose a topic...</option>
<option value="general">General inquiry</option>
<option value="support">Technical support</option>
<option value="partnership">Partnership</option>
<option value="feedback">Feedback</option>
<option value="report">Report a problem</option>
<option value="incorrect">Report incorrect information</option>
</select>

<label for="email">Your email</label>
<input type="email" id="email" placeholder="you@example.com" required>

<label for="subject">Subject line</label>
<input type="text" id="subject" placeholder="Brief summary" maxlength="120" required>

<label for="message">Message</label>
<textarea id="message" placeholder="Write your message here..." maxlength="2000" required></textarea>

<button type="submit" class="btn p" style="width:100%;padding:14px" id="submitBtn">Send Message</button>
</form>
</div>

<footer><div class="w">
<div><span class="logo">CHOZ</span><br>"Choose without the noise."<br>Web owned and created by Salahuddin Ranu.</div>
<div class="ln">
<a href="/privacy.html">Privacy</a>
<a href="/terms.html">Terms</a>
<a href="/contact.html">Contact</a>
<a href="/about.html">About</a>
<a href="/faq.html">FAQ</a>
</div>
</div></footer>

<script src="/js/config.js"></script>
<script>
const form = document.getElementById('contactForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    const payload = {
        type: document.getElementById('type').value,
        email: document.getElementById('email').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value.trim()
    };

    if (!payload.type || !payload.email || !payload.subject || !payload.message) {
        msg.className = 'msg err';
        msg.textContent = 'All fields are required.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        return;
    }

    const { error } = await sb.from('feedback').insert(payload);

    if (error) {
        msg.className = 'msg err';
        msg.textContent = 'Could not send: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        return;
    }

    msg.className = 'msg ok';
    msg.textContent = '✓ Message sent! We will get back to you soon.';
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Message';
});
</script>
</body>
</html>
