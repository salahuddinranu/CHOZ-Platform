<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — CHOZ</title>
<meta name="description" content="Get in touch with the CHOZ team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.contact-wrap{padding:60px 0;max-width:560px;margin:0 auto}
.contact-wrap h1{font-size:clamp(32px,5vw,48px);margin-bottom:12px;letter-spacing:-1px}
.contact-wrap .lead{color:var(--mute);font-size:16px;margin-bottom:32px}
.contact-wrap label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.contact-wrap input,.contact-wrap textarea,.contact-wrap select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:16px;font-family:inherit;background:var(--sf);color:var(--ink)}
.contact-wrap textarea{min-height:140px;resize:vertical}
.msg{padding:14px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none}
.msg.ok{background:#dcfce7;color:#166534;display:block}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ABC123XYZ4"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8X6MPBHLEJ');
</script>
</head>
<body>
<nav><div class="w">
<a class="logo" href="/">CHOZ</a>
<div class="sp"></div>
<a class="btn" href="/">← Back to CHOZ</a>
</div></nav>

<div class="w contact-wrap">
<h1>Contact Us</h1>
<p class="lead">Send us a message. We reply to all messages within 2 business days.</p>

<!-- FormSubmit Action -->
<form id="contactForm" action="https://formsubmit.co/salahuddinranu@gmail.com" method="POST">
    
    <!-- FormSubmit Settings -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://choz-platform.pages.dev/contact.html?success=true">
    <input type="hidden" name="_subject" value="New message from CHOZ Contact Form">
    
    <label for="type">Subject</label>
    <select id="type" name="Subject" required>
        <option value="">Choose a topic...</option>
        <option value="General inquiry">General inquiry</option>
        <option value="Technical support">Technical support</option>
        <option value="Partnership">Partnership</option>
        <option value="Feedback">Feedback</option>
        <option value="Report a problem">Report a problem</option>
        <option value="Report incorrect information">Report incorrect information</option>
    </select>

    <label for="email">Your email</label>
    <input type="email" id="email" name="Email" placeholder="you@example.com" required>

    <label for="subject">Subject line</label>
    <input type="text" id="subject" name="Subject Line" placeholder="Brief summary" maxlength="120" required>

    <label for="message">Message</label>
    <textarea id="message" name="Message" placeholder="Write your message here..." maxlength="2000" required></textarea>

    <button type="submit" class="btn p" style="width:100%;padding:14px">Send Message</button>
</form>
</div>

<footer><div class="w">
<div><span class="logo">CHOZ</span><br>"Choose without the noise."<br>Web owned and created by Salahuddin Ranu.</div>
<div class="ln">
<a href="/privacy.html">Privacy</a>
<a href="/terms.html">Terms</a>
<a href="/contact.html">Contact</a>
<a href="/about.html">About</a>
<a href="/faq.html">FAQ</a>
</div>
</div></footer>

<script>
    // Success message check karein
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success') === 'true') {
        alert('✅ Your message has been sent successfully! We will get back to you soon.');
        // URL clean karein
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
</body>
</html>
